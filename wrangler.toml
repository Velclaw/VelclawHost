name = "velclawhost"
main = "edge-worker/src/index.ts"
compatibility_date = "2026-10-06"
workers_dev = true

# Cloudflare remains the edge layer. The control plane origin is supplied
# through the CONTROL_PLANE_ORIGIN Worker variable and must point to AWS.
# No Render origin or fallback is permitted.

[[routes]]
pattern = "velclaw.site/*"
zone_name = "velclaw.site"

[[routes]]
pattern = "api.velclaw.site/*"
zone_name = "velclaw.site"
