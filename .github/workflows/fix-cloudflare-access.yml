name: Secure velclaw.site authentication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-cloudflare-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure real Cloudflare login for velclaw.site
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")

          if [[ -z "${CF_API_TOKEN:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

          if [[ -z "${CF_ACCOUNT_ID:-}" ]]; then
            zone="$(curl -fsS "${auth[@]}" "${api}/zones?name=velclaw.site&per_page=1")"
            CF_ACCOUNT_ID="$(jq -r '.result[0].account.id // empty' <<<"$zone")"
          fi

          if [[ -z "${CF_ACCOUNT_ID:-}" ]]; then
            echo "Could not resolve the Cloudflare account for velclaw.site."
            exit 1
          fi

          apps="$(curl -fsS "${auth[@]}" "${api}/accounts/${CF_ACCOUNT_ID}/access/apps?domain=velclaw.site&per_page=1000")"
          if [[ "$(jq -r '.success' <<<"$apps")" != "true" ]]; then
            echo "$apps" | jq .
            exit 1
          fi

          app_id="$(jq -r '.result[]? | select((.domain // "") == "velclaw.site") | .id' <<<"$apps" | head -n1)"

          if [[ -z "$app_id" ]]; then
            echo "No velclaw.site Access application exists."
            exit 1
          fi

          echo "Securing Access application $app_id."

          policies="$(curl -fsS "${auth[@]}" "${api}/accounts/${CF_ACCOUNT_ID}/access/apps/${app_id}/policies?per_page=1000")"
          if [[ "$(jq -r '.success' <<<"$policies")" != "true" ]]; then
            echo "$policies" | jq .
            exit 1
          fi

          # Remove the temporary public Everyone/Bypass policy created during initial deployment.
          while IFS=$'\\t' read -r policy_id decision; do
            [[ -z "$policy_id" ]] && continue
            if [[ "$decision" == "bypass" ]]; then
              echo "Removing public bypass policy $policy_id."
              result="$(curl -fsS -X DELETE "${auth[@]}" "${api}/accounts/${CF_ACCOUNT_ID}/access/apps/${app_id}/policies/${policy_id}")"
              if [[ "$(jq -r '.success' <<<"$result")" != "true" ]]; then
                echo "$result" | jq .
                exit 1
              fi
            fi
          done < <(jq -r '.result[]? | [.id, (.decision // "")] | @tsv' <<<"$policies")

          # Allow only members of this Cloudflare account. Authentication is performed by
          # Cloudflare Access, producing a real authenticated session/JWT rather than a public bypass.
          current="$(curl -fsS "${auth[@]}" "${api}/accounts/${CF_ACCOUNT_ID}/access/apps/${app_id}/policies?per_page=1000")"
          if jq -e '.result[]? | select(.decision == "allow") | .include[]? | .cloudflare_account_member? != null' <<<"$current" >/dev/null; then
            echo "Cloudflare account-member login policy already exists."
            exit 0
          fi

          body="$(jq -n --arg account "$CF_ACCOUNT_ID" '{
            name: "VelclawHost Account Members",
            decision: "allow",
            include: [{cloudflare_account_member: {account_id: $account}}],
            precedence: 1,
            session_duration: "24h"
          }')"

          result="$(curl -fsS -X POST "${auth[@]}"             "${api}/accounts/${CF_ACCOUNT_ID}/access/apps/${app_id}/policies"             --data "$body")"

          if [[ "$(jq -r '.success' <<<"$result")" != "true" ]]; then
            echo "$result" | jq .
            exit 1
          fi

          echo "Real authenticated login policy created: $(jq -r '.result.id' <<<"$result")"
