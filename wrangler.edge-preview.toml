name = "velclawhost-migration-preview"
main = "cloudflare/edge-preview-worker.js"
compatibility_date = "2026-11-17"
account_id = "fdf1ce80b330dcf8b0924259b048d39c"
workers_dev = true
routes = [
  { pattern = "velclawhost-preview.ocodejs.dev/*", zone_name = "ocodejs.dev" }
]

[assets]
directory = "./dist/cloudflare-assets"
binding = "ASSETS"
run_worker_first = ["/health", "/api/*"]
not_found_handling = "single-page-application"

[vars]
LEGACY_API_ORIGIN = "https://velclawhost.onrender.com"

# This configuration attaches only the previously authorized Preview hostname.
# Do not add production routes, aliases, or bindings.
