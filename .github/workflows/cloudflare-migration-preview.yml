name: Cloudflare Migration Preview

on:
  push:
    branches:
      - "feat/cloudflare-native-migration-preview"
      - "feat/cloudflare-static-frontend-preview"
  pull_request:
    branches: ["main"]
    paths:
      - "cloudflare/**"
      - "wrangler*.toml"
      - "docs/CLOUDFLARE_MIGRATION.md"
      - ".github/workflows/cloudflare-migration-preview.yml"

permissions:
  contents: read

jobs:
  preview-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Install dependencies
        run: bun install
      - name: Check Worker syntax
        run: node --check cloudflare/edge-preview-worker.js
      - name: Run edge preview Worker tests
        run: node --test cloudflare/edge-preview-worker.test.mjs
      - name: Build static frontend for Cloudflare
        run: bunx vite build --outDir dist/cloudflare-assets
      - name: Verify static output
        run: |
          test -s dist/cloudflare-assets/index.html
          test ! -e dist/cloudflare-assets/server.cjs
          test ! -e dist/cloudflare-assets/runtime-worker.cjs
