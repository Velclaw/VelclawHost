AWSTemplateFormatVersion: "2010-09-09"
Description: >
  VelclawHost Preview bootstrap for ap-southeast-2. Creates only IAM/OIDC,
  ECR repositories, an ECS cluster, and a bounded-retention CloudWatch log group.
  It intentionally does not create billable compute, load balancers, NAT, or databases.

Parameters:
  GitHubOwner:
    Type: String
    Default: Velclaw
    AllowedPattern: "^[A-Za-z0-9-]+$"
  GitHubRepository:
    Type: String
    Default: app-velclaw
    AllowedPattern: "^[A-Za-z0-9._-]+$"
  GitHubEnvironment:
    Type: String
    Default: preview
    AllowedPattern: "^[A-Za-z0-9_-]+$"
  EcrImageRetentionCount:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]

Resources:
  GitHubActionsOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GitHubPreviewDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub Actions Preview-only deployment role for VelclawHost.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubActionsOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepository}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: VelclawHostPreviewEcrPush
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushOnlyToVelclawHostRepositories
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                Resource:
                  - !GetAtt ControlPlaneRepository.Arn
                  - !GetAtt RuntimeWorkerRepository.Arn
        - PolicyName: VelclawHostPreviewEcsReadAndDeploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribePreviewCluster
                Effect: Allow
                Action:
                  - ecs:DescribeClusters
                  - ecs:DescribeTaskDefinition
                  - ecs:ListTaskDefinitions
                Resource: "*"
              - Sid: ListOnlyPreviewClusterServices
                Effect: Allow
                Action: ecs:ListServices
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/velclawhost-preview"
              - Sid: DescribeAndUpdateOnlyPreviewServices
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/velclawhost-preview/*"
              - Sid: RegisterOnlyVelclawHostTaskDefinitions
                Effect: Allow
                Action: ecs:RegisterTaskDefinition
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/velclawhost-*"
              - Sid: RunTasksOnlyOnPreviewCluster
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/velclawhost-*"
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/velclawhost-preview"
              - Sid: DescribeTasksOnlyOnPreviewCluster
                Effect: Allow
                Action: ecs:DescribeTasks
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/velclawhost-preview/*"
              - Sid: PassOnlyVelclawHostTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ControlPlaneTaskExecutionRole.Arn
                  - !GetAtt ControlPlaneTaskRole.Arn
                  - !GetAtt RuntimeWorkerTaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  ControlPlaneTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ControlPlaneTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Application permissions are added only after feature-level review.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  RuntimeWorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Runtime worker permissions are added only after isolation design review.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  ControlPlaneRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: velclawhost/control-plane
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep the newest ${EcrImageRetentionCount} images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": ${EcrImageRetentionCount}
              },
              "action": { "type": "expire" }
            }]
          }

  RuntimeWorkerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: velclawhost/runtime-worker
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep the newest ${EcrImageRetentionCount} images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": ${EcrImageRetentionCount}
              },
              "action": { "type": "expire" }
            }]
          }

  VelclawHostPreviewCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: velclawhost-preview
      Tags:
        - Key: Application
          Value: VelclawHost
        - Key: Environment
          Value: Preview
        - Key: ManagedBy
          Value: CloudFormation

  VelclawHostPreviewLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /velclawhost/preview
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  GitHubPreviewDeployRoleArn:
    Description: Set as AWS_ROLE_ARN in the GitHub Preview environment.
    Value: !GetAtt GitHubPreviewDeployRole.Arn
  EcrControlPlaneRepositoryUri:
    Value: !GetAtt ControlPlaneRepository.RepositoryUri
  EcrRuntimeWorkerRepositoryUri:
    Value: !GetAtt RuntimeWorkerRepository.RepositoryUri
  EcsPreviewClusterName:
    Value: !Ref VelclawHostPreviewCluster
  CloudWatchLogGroupName:
    Value: !Ref VelclawHostPreviewLogGroup
  Region:
    Value: !Ref AWS::Region
