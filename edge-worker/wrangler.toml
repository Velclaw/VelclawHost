name = "velclawhost-app"
main = "src/index.ts"
compatibility_date = "2026-10-06"
workers_dev = true

# Cloudflare edge routes; backend origin is supplied by CONTROL_PLANE_ORIGIN.
# This Worker must never fall back to Render.

[[routes]]
pattern = "velclaw.site/*"
zone_name = "velclaw.site"

[[routes]]
pattern = "api.velclaw.site/*"
zone_name = "velclaw.site"

# Required by `wrangler preview` used in Cloudflare Workers Builds.
# This enables branch preview deployments; it does not create a production route.
[previews]
