name: Secure velclaw.site authentication # VelclawHost branded OAuth

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-cloudflare-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure real Cloudflare login for velclaw.site
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          python3 <<'PY'
          import json, os, urllib.parse, urllib.request

          TOKEN = os.environ.get("CF_API_TOKEN", "").strip()
          ACCOUNT = os.environ.get("CF_ACCOUNT_ID", "").strip()
          BASE = "https://api.cloudflare.com/client/v4"
          if not TOKEN:
              raise SystemExit("CLOUDFLARE_API_TOKEN is missing.")

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(BASE + path, data=data, method=method)
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("Content-Type", "application/json")
              req.add_header("Accept", "application/json")
              with urllib.request.urlopen(req, timeout=20) as r:
                  body = json.load(r)
              if not body.get("success"):
                  raise RuntimeError(json.dumps(body))
              return body

          if not ACCOUNT:
              zones = api("GET", "/zones?name=velclaw.site&per_page=1")
              ACCOUNT = ((zones.get("result") or [{}])[0].get("account") or {}).get("id", "")
          if not ACCOUNT:
              raise SystemExit("Could not resolve the Cloudflare account for velclaw.site.")

          apps = api("GET", f"/accounts/{ACCOUNT}/access/apps?domain=velclaw.site&per_page=1000").get("result", [])
          base_app = next((x for x in apps if x.get("domain") == "velclaw.site"), None)
          if not base_app:
              raise SystemExit("No velclaw.site Access application exists.")

          policies = api("GET", f"/accounts/{ACCOUNT}/access/apps/{base_app['id']}/policies?per_page=1000").get("result", [])
          policy = next((x for x in policies if x.get("decision") == "bypass"), None)
          if not policy:
              policy = next((x for x in policies if x.get("name") == "VelclawHost Account Members"), None)
          if not policy:
              raise SystemExit("No existing policy found to secure.")

          api("PUT", f"/accounts/{ACCOUNT}/access/apps/{base_app['id']}/policies/{policy['id']}", {
              "name": "VelclawHost Account Members",
              "decision": "allow",
              "include": [{"cloudflare_account_member": {"account_id": ACCOUNT}}],
              "precedence": 1,
              "session_duration": "24h",
          })

          idps = api("GET", f"/accounts/{ACCOUNT}/access/identity_providers?per_page=100").get("result", [])
          by_type = {x.get("type"): x for x in idps}

          # Cloudflare is the built-in Velclaw identity option.
          cf = by_type.get("cloudflare")
          if cf and not cf.get("read_only"):
              try:
                  api("PUT", f"/accounts/{ACCOUNT}/access/identity_providers/{cf['id']}", {
                      "name": "Velclaw", "type": "cloudflare", "config": {}
                  })
                  cf["name"] = "Velclaw"
              except Exception:
                  pass

          def configure_social(kind, name, client_env, secret_env):
              cid, secret = os.environ.get(client_env, "").strip(), os.environ.get(secret_env, "").strip()
              if not cid or not secret:
                  return
              existing = by_type.get(kind)
              payload = {"name": name, "type": kind, "config": {"client_id": cid, "client_secret": secret}}
              if existing:
                  api("PUT", f"/accounts/{ACCOUNT}/access/identity_providers/{existing['id']}", payload)
              else:
                  created = api("POST", f"/accounts/{ACCOUNT}/access/identity_providers", payload).get("result", {})
                  by_type[kind] = created
              print("Configured", name)

          configure_social("google", "Google", "GOOGLE_OAUTH_CLIENT_ID", "GOOGLE_OAUTH_CLIENT_SECRET")
          configure_social("github", "GitHub", "GITHUB_OAUTH_CLIENT_ID", "GITHUB_OAUTH_CLIENT_SECRET")

          apps = api("GET", f"/accounts/{ACCOUNT}/access/apps?per_page=1000").get("result", [])

          def ensure_app(domain, name, idp_id=None, public=False):
              existing = next((x for x in apps if x.get("domain") == domain), None)
              if public:
                  payload = {
                      "name": name,
                      "type": "self_hosted",
                      "domain": domain,
                      "destinations": [{"type": "public", "uri": domain}],
                      "session_duration": "24h",
                      "policies": [{
                          "decision": "bypass", "name": "Public OAuth selector",
                          "precedence": 1, "include": [{"everyone": {}}],
                      }],
                  }
              else:
                  payload = {
                      "name": name,
                      "type": "self_hosted",
                      "domain": domain,
                      "destinations": [{"type": "public", "uri": domain}],
                      "allowed_idps": [idp_id],
                      "auto_redirect_to_identity": True,
                      "session_duration": "24h",
                      "policies": [{
                          "decision": "allow", "name": "Velclaw owner",
                          "precedence": 1,
                          "include": [{"email": {"email": "huynhthuong.xyz@gmail.com"}}],
                      }],
                  }
              if existing:
                  try:
                      api("PUT", f"/accounts/{ACCOUNT}/access/apps/{existing['id']}", payload)
                      return existing
                  except Exception:
                      return existing
              created = api("POST", f"/accounts/{ACCOUNT}/access/apps", payload).get("result", {})
              apps.append(created)
              return created

          ensure_app("velclaw.site/auth*", "VelclawHost OAuth Selector", public=True)

          for slug, label, kind in [
              ("velclaw", "VelclawHost • Velclaw", "cloudflare"),
              ("google", "VelclawHost • Google", "google"),
              ("github", "VelclawHost • GitHub", "github"),
          ]:
              provider = by_type.get(kind)
              if provider and provider.get("id"):
                  ensure_app(f"velclaw.site/auth/{slug}", label, provider["id"])

          print("VelclawHost self-hosted OAuth routing is configured.")
          print("Providers:", ", ".join(sorted(k for k,v in by_type.items() if v)))
          PY
