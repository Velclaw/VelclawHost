 <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".7" fill="#687080" opacity=".16"/><circle cx="18" cy="15" r=".6" fill="#687080" opacity=".13"/></pattern>
