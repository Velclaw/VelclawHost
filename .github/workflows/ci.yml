name: VelclawHost CI

on:
  push:
    branches: ["main", "feature/**", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      # Next.js dependencies are added during the Vite-to-Next migration.
      # Allow Bun to reconcile bun.lock until the refreshed lockfile is committed.
      - run: bun install
      - run: bun run lint
      - run: bun run build
      - run: bun run worker:build
      - run: docker build --tag velclawhost:ci .
      - run: docker build --file runtime-worker/Dockerfile --tag velclawhost-runtime-worker:ci .
