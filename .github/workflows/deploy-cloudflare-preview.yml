name: Deploy VelclawHost Cloudflare Preview

on:
  push:
    branches: ["feat/cloudflare-static-frontend-preview"]
    paths:
      - "cloudflare/edge-preview-worker.js"
      - "cloudflare/edge-preview-worker.test.mjs"
      - "wrangler.edge-preview.toml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-cloudflare-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/feat/cloudflare-static-frontend-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install

      - name: Build static frontend
        run: bunx vite build --outDir dist/cloudflare-assets

      - name: Verify static output
        run: |
          test -s dist/cloudflare-assets/index.html
          test ! -e dist/cloudflare-assets/server.cjs
          test ! -e dist/cloudflare-assets/runtime-worker.cjs

      - name: Deploy isolated Cloudflare Preview
        run: bunx wrangler deploy --config wrangler.edge-preview.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
