name: VelclawHost Free Preview

on:
  pull_request:
    branches: ["main"]
    paths:
      - "cloudflare/free-preview-worker.js"
      - "cloudflare/free-preview-worker.test.mjs"
      - "wrangler.free-preview.toml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-free-preview.yml"
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: "Deploy the isolated workers.dev Free Preview (no custom domain or Production routes)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Install dependencies
        run: bun install
      - name: Check Worker syntax
        run: node --check cloudflare/free-preview-worker.js
      - name: Test Free Preview Worker
        run: node --test cloudflare/free-preview-worker.test.mjs
      - name: Build static frontend
        run: bunx vite build --outDir dist/cloudflare-assets
      - name: Verify static bundle
        run: |
          test -s dist/cloudflare-assets/index.html
          test ! -e dist/cloudflare-assets/server.cjs
          test ! -e dist/cloudflare-assets/runtime-worker.cjs
      - name: Upload static bundle
        uses: actions/upload-artifact@v4
        with:
          name: velclawhost-free-preview-assets
          path: dist/cloudflare-assets/
          if-no-files-found: error
          retention-days: 3

  deploy-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_preview
    needs: verify
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Install dependencies
        run: bun install
      - name: Build static frontend
        run: bunx vite build --outDir dist/cloudflare-assets
      - name: Deploy isolated workers.dev Preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.free-preview.toml
