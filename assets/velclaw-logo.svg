<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">VelClaw</title><desc id="desc">VelClaw silver angular V and claw emblem with Code. Innovate. Elevate. tagline.</desc>
