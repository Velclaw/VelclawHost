name = "velclawhost-free-preview"
main = "cloudflare/free-preview-worker.js"
compatibility_date = "2026-11-17"
workers_dev = true

# No custom routes, DNS, production aliases, secrets, or upstream origins.
# This worker is deployed as a distinct workers.dev Preview only.

[assets]
directory = "./dist/cloudflare-assets"
binding = "ASSETS"
run_worker_first = ["/health", "/api/*"]
not_found_handling = "single-page-application"
